[package]
name = "csm-rs-demo"
version = "0.1.0"
edition = "2021"
publish = false
license = "LGPL-3.0-only"
repository = "https://github.com/LotfiZ/csm-rs-demo"
description = "Local interactive demonstration for the csm-rs library"

[dependencies]
csm-rs = { git = "https://github.com/LotfiZ/csm-rs.git", rev = "ce434638699ab495ddd96937d674a0823f36e9e9" }
axum = "0.8"
tower-http = { version = "0.6", features = ["fs"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }

[profile.release]
lto = true
